# One run of one test. The settings come from a test file in examples/:
#   docker compose --env-file examples/lan.env up --build --exit-code-from publisher
# Start order: broker, subscriber, publishers. The run stops when the publisher container exits.

# Network profile: QDISC from the test file goes on pub0 at the two ends of the publisher link
# (publisher container and broker). Thus, it applies once in each direction.
# delay = RTT / 2 when the source gives an RTT.
# netem syntax: delay MEAN JITTER CORRELATION, loss PERCENT CORRELATION.
# Without "distribution", the jitter is uniform in MEAN +/- JITTER. With "distribution normal", sigma is JITTER.
# There is no link rate. The benchmark measures the bandwidth.

x-node: &node
  build: .
  image: mqtt-tls-vs-quic
  volumes:
    - ./certs:/certs:ro
    - ./${RESULTS}:/results
  environment:
    SSLKEYLOGFILE: ${TLS_KEY_LOG} # TLS secrets to decrypt a capture; empty = no file

services:
  mqtt-broker:
    <<: *node
    networks:
      publishers: {interface_name: pub0}
      subscriber: {interface_name: sub0}
    cap_add: [NET_ADMIN]
    ulimits: {nofile: 1048576}
    command: sh -c "tc qdisc replace dev pub0 root ${QDISC} && exec broker -out /results"
    healthcheck:
      test: ss -ltn | grep -q :8883
      interval: 1s
      retries: 30

  subscriber:
    <<: *node
    networks:
      subscriber: {interface_name: sub0}
    depends_on:
      mqtt-broker: {condition: service_healthy}
    command: gen sub -transport ${TRANSPORT} -t ${TOPIC_PREFIX}/# -out /results
    healthcheck:
      test: test -f /results/sub.csv # gen sub makes this file when the subscription is active
      interval: 1s
      retries: 30

  publisher:
    <<: *node
    networks:
      publishers: {interface_name: pub0}
    cap_add: [NET_ADMIN]
    ulimits: {nofile: 1048576}
    depends_on:
      subscriber: {condition: service_healthy}
      capture: {condition: service_started, required: false}
    # With this local route, each publisher can bind its own address in PUBLISHER_ADDRESSES.
    command: >-
      sh -c "ip route add local ${PUBLISHER_ADDRESSES} dev pub0 &&
      tc qdisc replace dev pub0 root ${QDISC} &&
      exec gen pub -transport ${TRANSPORT} -c ${PUBLISHERS} -R ${CONNECT_RATE} -rate ${MESSAGE_RATE}
      -s ${PAYLOAD_SIZE} -prefix ${TOPIC_PREFIX} -steady ${STEADY_SECONDS} -pad ${PADDING_SECONDS}
      -bind ${FIRST_PUBLISHER_ADDRESS} -out /results"

  # Optional: set COMPOSE_PROFILES=capture in the test file. tcpdump runs in the network namespace
  # of the broker and keeps the first CAPTURE_PACKETS packets on the MQTT ports.
  # Compose stops the run when a container exits. Thus, sleep keeps this service up after tcpdump stops.
  capture:
    <<: *node
    profiles: [capture]
    network_mode: service:mqtt-broker
    init: true
    command: >-
      sh -c "tcpdump -i any -U -c ${CAPTURE_PACKETS} -w /results/broker.pcap
      '(tcp port 8883 or udp port 14567) and not net 127.0.0.0/8';
      exec sleep infinity"

networks:
  publishers:
    ipam: {config: [{subnet: "${PUBLISHER_SUBNET}", ip_range: "${CONTAINER_ADDRESSES}"}]}
  subscriber:
    ipam: {config: [{subnet: 10.78.2.0/24}]}
