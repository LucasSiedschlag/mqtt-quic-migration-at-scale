services:
  mqtt-broker:
    build: .
    image: mqtt-tls-vs-quic
    container_name: broker
    volumes:
      - ./certs:/certs:ro
      - ./${RESULTS_FOLDER}:/results
      - /etc/localtime:/etc/localtime:ro # time zone of the host
    networks:
      publishers: {interface_name: pub0}
      subscriber: {interface_name: sub0}
    cap_add: [NET_ADMIN]
    ulimits: {nofile: 1048576}
    command: >-
      sh -c "${ROUTED_PUBLISHER_ADDRESSES:+ip route add ${ROUTED_PUBLISHER_ADDRESSES} via ${PUBLISHER_CONTAINER_ADDRESS} &&}
      tc qdisc replace dev pub0 root ${QDISC} &&
      exec broker -max-pending ${BROKER_QUEUE_SIZE} -out /results"
    healthcheck:
      test: ss -ltn | grep -q :8883
      interval: 1s
      retries: 30

  subscriber:
    build: .
    image: mqtt-tls-vs-quic
    container_name: subscriber
    volumes:
      - ./${RESULTS_FOLDER}:/results
      - /etc/localtime:/etc/localtime:ro # time zone of the host
    environment:
      SSLKEYLOGFILE: ${TLS_KEY_LOG:-} # TLS keys for Wireshark
    networks:
      subscriber: {interface_name: sub0}
    depends_on:
      mqtt-broker: {condition: service_healthy}
    command: gen sub -transport ${TRANSPORT} -t ${TOPIC_PREFIX}/# -out /results
    healthcheck:
      test: test -f /results/sub.csv # appears once subscribed
      interval: 1s
      retries: 30

  publisher:
    build: .
    image: mqtt-tls-vs-quic
    container_name: publisher
    volumes:
      - ./${RESULTS_FOLDER}:/results
      - /etc/localtime:/etc/localtime:ro # time zone of the host
    environment:
      SSLKEYLOGFILE: ${TLS_KEY_LOG:-} # TLS keys for Wireshark
    networks:
      publishers: {interface_name: pub0, ipv4_address: "${PUBLISHER_CONTAINER_ADDRESS:-}"}
    cap_add: [NET_ADMIN]
    ulimits: {nofile: 1048576}
    depends_on:
      subscriber: {condition: service_healthy}
      capture: {condition: service_started, required: false}
    command: >-
      sh -c "${DIRECT_PUBLISHER_ADDRESSES:+ip route add local ${DIRECT_PUBLISHER_ADDRESSES} dev pub0 &&}
      ${ROUTED_PUBLISHER_ADDRESSES:+ip route add local ${ROUTED_PUBLISHER_ADDRESSES} dev lo &&}
      tc qdisc replace dev pub0 root ${QDISC} &&
      exec gen pub -transport ${TRANSPORT} -c ${PUBLISHERS} -rate ${MESSAGE_RATE} -s ${PAYLOAD_BYTES}
      -R ${CONNECT_RATE:-400} -steady ${STEADY_SECONDS:-30} -pad ${PADDING_SECONDS:-3} -prefix ${TOPIC_PREFIX}
      -bind ${FIRST_PUBLISHER_ADDRESS} -move=${MOVE_AT_SECONDS:-} -move-mode=${MOVE_MODE:-migrate}
      -0rtt=${ZERO_RTT:-false} -move-drop=${DROP_OLD_ADDRESSES:-false} -out /results"

  capture:
    build: .
    image: mqtt-tls-vs-quic
    container_name: capture
    volumes:
      - ./${RESULTS_FOLDER}:/results
    profiles: [capture]
    network_mode: service:mqtt-broker # captures in the network of the broker
    init: true
    command: >- # sleep keeps it up: compose stops the run when any container exits
      sh -c "tcpdump -i any -U -c ${CAPTURE_PACKETS:-100000} -w /results/broker.pcap
      '(tcp port 8883 or udp port 14567) and not net 127.0.0.0/8';
      exec sleep infinity"

networks:
  publishers:
    ipam: {config: [{subnet: "${PUBLISHER_NETWORK}", ip_range: "${DOCKER_ADDRESS_RANGE}"}]}
  subscriber:
    ipam: {config: [{subnet: "${SUBSCRIBER_NETWORK}"}]}
